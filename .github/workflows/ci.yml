name: Tests and container
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: python scripts/lock_backend.py
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install 'pytest==9.1.1' 'httpx==0.28.1' 'reportlab==5.1.0' 'pip-audit==2.10.1'
      - run: python -m pytest -c backend/pyproject.toml backend/tests -q
      - run: python -m pip_audit --disable-pip --no-deps -r backend/requirements.lock
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/audit_sources.py
      - name: Scan complete history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact=100 --no-banner
      - run: python scripts/create_pdf_test_slide.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: livemitschrift:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: livemitschrift:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
      - run: python scripts/test_container.py --viewers 50 --duration 10
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons --workspace @livemitschrift/desktop
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
