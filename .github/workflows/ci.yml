name: Tests and container
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: python scripts/lock_backend.py
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install 'pytest==9.2.0' 'httpx==0.28.1' 'reportlab==5.1.0' 'pip-audit==2.10.1'
      - run: python -m pytest -c backend/pyproject.toml backend/tests -q
      - run: python -m pip_audit --disable-pip --no-deps -r backend/requirements.lock
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/audit_sources.py
      - name: Scan complete history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact=100 --no-banner
      - run: python scripts/create_pdf_test_slide.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: livemitschrift:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: livemitschrift:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
      - run: python scripts/test_container.py --viewers 50 --duration 10 --max-schedule-lag 250
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons --workspace @livemitschrift/desktop
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
